<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
🏸 羽球輪轉小幫手 V9.1 Stable
</title>



<link rel="stylesheet" href="style.css">


<link rel="manifest" href="manifest.json">



<meta name="theme-color" content="#1f6feb">


</head>



<body>



<header class="topbar">


<button
class="menu-btn"
onclick="toggleMenu()">

☰

</button>




<div class="title">


<h1>
🏸 羽球輪轉小幫手
</h1>


<span>
V9.1 Stable
</span>


<div id="currentClubName">

</div>


</div>





<button
class="setting-btn"
onclick="openSettings()">

⚙️

</button>



</header>







<!-- 建立球團 -->


<div id="clubSetup"
class="modal">


<div class="modal-content">


<h2>
🏸 建立你的球團
</h2>



<input

id="clubNameInput"

placeholder="輸入球團名稱">


<button
onclick="createNewClub()">

開始使用

</button>



</div>


</div>








<!-- 側邊選單 -->


<div id="sideMenu"
class="side-menu">


<h2>
☰ 功能
</h2>




<button onclick="showHome()">

🏠 今日排場

</button>



<button onclick="showTodayPlayers()">

👥 今日活動

</button>




<button onclick="showClubPlayers()">

📋 社團球友

</button>




<button onclick="showStatistics()">

📊 今日統計

</button>




<button onclick="showClubManager()">

🏠 球團管理

</button>



</div>






<div id="overlay"
onclick="toggleMenu()">

</div>








<main>





<section class="info-bar">


<div>

👥

<span id="todayCount">

0

</span>

人


</div>



<div>

🏟

<span id="courtCount">

3

</span>

場


</div>




<div>

🏸 第

<span id="roundCount">

0

</span>

輪


</div>



</section>









<!-- 今日排場 -->


<section id="schedulePage">


<h2>
🏸 今日排場
</h2>



<div id="roundContainer">

</div>




<button

class="main-btn"

onclick="nextRound()">

🔄 下一輪排場

</button>



<button

onclick="clearRounds()">

🗑 清除今日排場

</button>



</section>









<!-- 今日活動 -->


<section
id="todayPlayersPage"
class="hidden">


<h2>
👥 今日活動
</h2>




<input

id="todaySearch"

placeholder="搜尋球友..."

oninput="searchTodayPlayers()">




<div

id="todayPlayerList"

class="player-box">

</div>




<button

onclick="confirmTodayPlayers()">

✔ 更新到場

</button>



</section>









<!-- 社團球友 -->


<section

id="clubPlayersPage"

class="hidden">



<h2>
📋 社團球友
</h2>





<input

id="clubSearch"

placeholder="搜尋球友..."

oninput="searchClubPlayers()">




<div

id="clubPlayerList"

class="player-box">

</div>





<input

id="newPlayerName"

placeholder="輸入球友姓名">





<button onclick="addClubPlayer()">

➕ 新增球友

</button>





<button onclick="addAllToday()">

👥 全部加入今日

</button>






<textarea

id="importPlayers"

placeholder="大量匯入名單（一行一位）">

</textarea>




<button onclick="importPlayers()">

📥 匯入

</button>




</section>









<!-- 統計 -->


<section

id="statisticsPage"

class="hidden">



<h2>

📊 今日統計

</h2>




<div id="statisticsBox">

</div>



</section>









<!-- 球團管理 -->


<section

id="clubManagerPage"

class="hidden">


<h2>

🏠 球團管理

</h2>




<div id="clubList">

</div>





<input

id="newClubName"

placeholder="新增球團名稱">





<button onclick="createNewClubFromList()">

➕ 新增球團

</button>




</section>








</main>









<!-- 設定視窗 -->


<div

id="settingModal"

class="modal"

style="display:none;">



<div class="modal-content">



<h2>

⚙️ 排場設定

</h2>





<label>

球場數

</label>



<input

id="courtSetting"

type="number"

value="3">






<label>

每場人數

</label>



<input

id="playerPerCourt"

type="number"

value="4">






<button onclick="saveSettings()">

儲存

</button>



<button onclick="closeSettings()">

取消

</button>




</div>

</div>









<script src="storage.js"></script>

<script src="scheduler.js"></script>

<script src="app.js"></script>








<script>


if(
"serviceWorker" in navigator
){


navigator.serviceWorker.register(
"service-worker.js"
);


}


</script>



</body>

</html>
