<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏸 空間羽航員 V5.6 Final</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>


<body>

<div class="app">


<h1>🏸 空間羽航員</h1>

<h2>V5.6 Final Ultimate</h2>

<p>羽球公平輪轉工具</p>



<section>

<h3>👥 球友管理</h3>


<input 
id="playerName"
placeholder="輸入球友姓名">


<button onclick="addPlayer()">
＋ 新增
</button>


<ul id="playerList"></ul>


</section>




<section>

<h3>🏟 今日設定</h3>


<label>
球場數
</label>


<input 
id="courtCount"
type="number"
value="2">



<br>



<label>
每場人數
</label>


<input 
id="peopleCount"
type="number"
value="4">



</section>





<section>


<h3>⚙️ 模式</h3>


<select id="mode">


<option value="double">
🏸 雙打模式
</option>


<option value="rotate">
🔄 三人輪替
</option>


<option value="free">
⭐ 自由模式
</option>


</select>



</section>





<section>


<button 
class="main"
onclick="startGame()">

🏸 開始排場

</button>



<button onclick="nextRound()">

🔄 下一輪

</button>



<button onclick="clearToday()">

🗑 清除今日

</button>


</section>





<section>


<h3>📋 排場結果</h3>


<div id="result">

尚未開始

</div>


</section>





<section>


<h3>📊 今日統計</h3>


<div id="stats">

尚無資料

</div>


</section>



</div>



<script src="storage.js"></script>

<script src="stats.js"></script>

<script src="scheduler.js"></script>

<script src="app.js"></script>


</body>


</html>
